<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>汎用スライドの土台</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eaed;color:var(--text);font-family:"Arial","Hiragino Kaku Gothic ProN","Yu Gothic","sans-serif"}:root{--background:#FFFFFF;--text:#111111;--coverText:#000000;--accent:#294285;--surface:#F1F2F4;--muted:#777777;--line:#D3D6DC;--rule:#333333;--footerLine:#CBD0D2;--series-0:#294285;--series-1:#7E8DAF;--series-2:#BCC3CF;--series-3:#E4E7ED;}.slide{position:relative;width:1280px;height:720px;background:var(--background);margin:24px auto;overflow:hidden}.shape,p,.box,.list,.chevron{position:absolute}p{margin:0;white-space:normal;line-break:strict;word-break:normal;line-height:1.5}.title{font-size:34px;font-weight:400;line-height:1.4}.cover{font-size:40px;font-weight:600;color:var(--coverText)}.punch{font-size:24px}.heading{font-size:24px}.heading{font-weight:600}.body{font-size:22px}.dense,.list li{font-size:20px}.note{font-size:18px;color:var(--muted)}.footer{font-size:10px;color:var(--muted)}.box{display:flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:0;overflow:hidden}.box p{position:static;width:100%;font-size:20px}.list{overflow:hidden}.list ul{margin:0;padding:0 0 0 20px}.list li{line-height:1.5;margin:0 0 10px}.chevron{display:flex;align-items:center;justify-content:center;padding:8px 22px;background:var(--surface);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}.chevron p{position:static;text-align:center;font-size:24px;font-weight:600;width:100%}@media print{body{background:white}.slide{margin:0;break-after:page}}</style></head><body data-slide-japanese-font="Hiragino Kaku Gothic ProN"><section id="slide-1" class="slide" data-pattern="cover" data-content-width="wide"><img alt="" src="brand-coverLogo.png" style="position:absolute;left:928px;top:251px;width:270px;height:96px;object-fit:contain"><div class="shape" style="left:78px;top:362px;width:1120px;height:1px;background:var(--line);transform-origin:0 50%;transform:rotate(0deg)"></div><p class="cover" style="left:86px;top:452px;width:1112px;height:60px;text-align:left;">本文レイアウト・チャート集</p><p class="punch" style="left:86px;top:558px;width:1112px;height:90px;text-align:left;color:var(--coverText)">情報の関係から構成を選ぶ<br>マスタと画面比率を切り替えて利用</p><div class="shape" style="left:22px;top:688px;width:1236px;height:1px;background:var(--footerLine);transform-origin:0 50%;transform:rotate(0deg)"></div><p class="footer" style="left:22px;top:700px;width:412px;height:18px;text-align:left;"></p><img alt="" src="brand-footerLogo.png" style="position:absolute;left:574px;top:694px;width:132px;height:25px;object-fit:contain"><p class="footer" style="left:1218px;top:700px;width:40px;height:18px;text-align:right;">1</p></section><section id="slide-2" class="slide" data-pattern="compare" data-content-width="wide"><p class="title" style="left:22px;top:26px;width:1236px;height:48px;text-align:left;">同じ条件で選択肢を比較する</p><div class="shape" style="left:22px;top:76px;width:1236px;height:1px;background:var(--rule);transform-origin:0 50%;transform:rotate(0deg)"></div><p class="heading" style="left:22px;top:122px;width:606px;height:40px;text-align:center;">選択肢A</p><div class="shape" style="left:22px;top:167px;width:606px;height:1px;background:var(--accent);transform-origin:0 50%;transform:rotate(0deg)"></div><div class="list" data-slide-native="list" style="left:22px;top:207px;width:606px;height:290px"><ul><li>現在の仕組みを活かし、変更する範囲を絞る。</li><li>短期間で着手できる</li><li>対象外となる範囲を確認する</li><li>既存の制約が残る</li></ul></div><p class="heading" style="left:652px;top:122px;width:606px;height:40px;text-align:center;">選択肢B</p><div class="shape" style="left:652px;top:167px;width:606px;height:1px;background:var(--accent);transform-origin:0 50%;transform:rotate(0deg)"></div><div class="list" data-slide-native="list" style="left:652px;top:207px;width:606px;height:290px"><ul><li>共通の仕組みを整え、対象範囲を広げる。</li><li>複数の用途に対応できる</li><li>移行に必要な準備を確認する</li><li>初期の作業が増える</li></ul></div><div class="shape" style="left:22px;top:688px;width:1236px;height:1px;background:var(--footerLine);transform-origin:0 50%;transform:rotate(0deg)"></div><p class="footer" style="left:22px;top:700px;width:412px;height:18px;text-align:left;"></p><img alt="" src="brand-footerLogo.png" style="position:absolute;left:574px;top:694px;width:132px;height:25px;object-fit:contain"><p class="footer" style="left:1218px;top:700px;width:40px;height:18px;text-align:right;">2</p></section><script src="slide-layout.js"></script></body></html>
